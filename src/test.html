<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reservoir Tea-Cup Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background:#0e1a24; color:#dce6ec; margin:0; padding:24px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  p.sub { color:#7f97a3; font-size:13px; margin:0 0 20px; }
  #map { background:#122430; border-radius:10px; }
  .basin { fill:#1a3242; stroke:#2c4c60; stroke-width:1.5; }
  .river { fill:none; stroke:#2c5b78; stroke-width:2; }
  .cup-outline { fill:none; stroke:#9fb8c4; stroke-width:1.5; }
  .cup-water { fill:#3aa0d1; }
  .cup-label { fill:#dce6ec; font-size:11px; font-weight:600; text-anchor:middle; }
  .cup-pct { fill:#7fd0ff; font-size:10px; text-anchor:middle; }
  .node:hover .cup-outline { stroke:#fff; }
  #controls { margin-top:18px; display:flex; flex-wrap:wrap; gap:14px; }
  .ctrl { background:#152a38; border-radius:8px; padding:10px 14px; min-width:190px; }
  .ctrl label { display:block; font-size:12px; color:#9fb8c4; margin-bottom:6px; }
  .ctrl .val { font-size:12px; color:#7fd0ff; float:right; }
  footer { margin-top:20px; font-size:12px; color:#607280; max-width:640px; line-height:1.5; }
  code { background:#152a38; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>

<h1>Reservoir Tea-Cup Diagrams dynamic prototype</h1>

<svg id="map" width="640" height="420"></svg>
<div id="controls"></div>

<footer>

</footer>

<script>
let reservoirs = [
  { id: "powell",  name: "Lake Powell",   x: 190, y: 120, capacity: 24322, storage: 9000 },
  { id: "mead",    name: "Lake Mead",     x: 420, y: 260, capacity: 26120, storage: 17800 },
  { id: "flaming", name: "Flaming Gorge", x: 300, y: 70,  capacity: 3749,  storage: 2900 },
  { id: "navajo",  name: "Navajo",        x: 140, y: 250, capacity: 1708,  storage: 1100 },
];

const svg = d3.select("#map");

svg.append("path").attr("class", "basin")
  .attr("d", "M60,40 L580,40 L560,380 L80,380 Z");
svg.append("path").attr("class", "river")
  .attr("d", "M190,120 C250,180 350,200 420,260 C380,300 300,340 140,250");

function cupPath(w, h) {
  const topW = w * 0.7, botW = w;
  return `M ${-topW/2},0 L ${topW/2},0 L ${botW/2},${h} L ${-botW/2},${h} Z`;
}

function renderCup(sel, d) {
  const w = 46, h = 40;
  const pct = Math.max(0, Math.min(1, d.storage / d.capacity));

  let g = sel.select("g.node");
  if (g.empty()) {
    g = sel.append("g").attr("class", "node")
      .attr("transform", `translate(${d.x - w/2}, ${d.y - h/2})`);

    const clipId = `clip-${d.id}`;
    g.append("clipPath").attr("id", clipId)
      .append("path").attr("d", cupPath(w, h));

    g.append("rect").attr("class", "cup-water")
      .attr("clip-path", `url(#${clipId})`)
      .attr("x", -w/2).attr("width", w);

    g.append("path").attr("class", "cup-outline").attr("d", cupPath(w, h));

    g.append("text").attr("class", "cup-label").attr("x", 0).attr("y", h + 16).text(d.name);
    g.append("text").attr("class", "cup-pct").attr("x", 0).attr("y", h + 29);
  }

  const waterH = h * pct;
  g.select("rect.cup-water").transition().duration(300)
    .attr("y", h - waterH).attr("height", waterH);

  g.select("text.cup-pct")
    .text(`${d.storage.toLocaleString()} / ${d.capacity.toLocaleString()} af (${Math.round(pct*100)}%)`);
}

function draw() {
  const sel = svg.selectAll("g.reservoir")
    .data(reservoirs, d => d.id)
    .join(enter => enter.append("g").attr("class", "reservoir"));
  sel.each(function(d) { renderCup(d3.select(this), d); });
}
draw();

const controls = d3.select("#controls");
reservoirs.forEach(d => {
  const ctrl = controls.append("div").attr("class", "ctrl");
  ctrl.append("label").html(`${d.name} <span class="val" id="val-${d.id}">${Math.round(100*d.storage/d.capacity)}%</span>`);
  ctrl.append("input")
    .attr("type", "range").attr("min", 0).attr("max", 100)
    .attr("value", Math.round(100 * d.storage / d.capacity))
    .on("input", function() {
      const pct = +this.value;
      d.storage = Math.round(d.capacity * pct / 100);
      d3.select(`#val-${d.id}`).text(pct + "%");
      draw();
    });
});
</script>
</body>
</html>
